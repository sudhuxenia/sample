name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'employee-app/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'employee-app/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::490497822745:role/github-actions-employee-app
  ECR_REPOSITORY: employee-app
  EC2_INSTANCE_ID: i-09e4cde3a0b687b3d
  CONTAINER_NAME: employee-app

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: employee-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Build image and deploy to EC2
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # lets GitHub sign in to AWS with OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" employee-app
          docker push --all-tags "$REGISTRY/$ECR_REPOSITORY"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 with SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          PARAMS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" \
            --arg name "$CONTAINER_NAME" \
            '{commands: [
              "set -e",
              "export PATH=$PATH:/snap/bin:/usr/local/bin",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker rm -f \($name) || true",
              "docker run -d --name \($name) --restart unless-stopped -p 80:80 \($image)",
              "docker image prune -af --filter until=168h",
              "docker ps --filter name=\($name)"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $ECR_REPOSITORY ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=0
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || STATUS=$?

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status: Status, Output: StandardOutputContent, Errors: StandardErrorContent}' --output yaml
          exit $STATUS
